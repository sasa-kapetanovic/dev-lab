---
services:

  postgres-db:
    image: postgres:17.6-alpine3.22
    container_name: postgres
    hostname: postgres
    restart: always
    ports:
      - 5411:5432
    env_file:
      - .env
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - poc

  keycloak:
    container_name: keycloak
    image: keycloak/keycloak:26.4
    restart: unless-stopped
    hostname: keycloak
    command: start-dev --import-realm
    ports:
      - "8080:8080"
      - "9090:9000"
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    env_file:
      - .env
    environment:
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - poc

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: always
    expose:
      - "8081"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/web:/usr/share/nginx/html:ro
    networks:
      - poc

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    restart: always
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "80:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8080/realms/dev-lab
      OAUTH2_PROXY_CLIENT_ID: demo-nginx
      OAUTH2_PROXY_CLIENT_SECRET: "CHANGE_ME_CLIENT_SECRET"
      OAUTH2_PROXY_COOKIE_SECRET: "0123456789abcdefghijklmnopqrstuv"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_UPSTREAMS: "http://nginx:8081"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_REDIRECT_URL: http://test.example.local/oauth2/callback
      OAUTH2_PROXY_SHOW_DEBUG_ON_ERROR: "true"
    extra_hosts:
      - "test.example.local:192.168.0.153"
    networks:
      - poc

volumes:
  postgres:
    driver: local
    name: postgres
networks:
  poc:
    driver: bridge