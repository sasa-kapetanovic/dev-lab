name: "Rollout Infrastructure"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'dev' || '' }}

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'dev' || '' }}

    defaults:
      run:
        working-directory: clouds/azure

    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.1"
      - run: terraform init -reconfigure -backend-config=backend/$ENVIRONMENT.backend.conf
      - run: terraform validate
      - run: echo "${{ secrets.TFVARS_FILE }}" | base64 -d > $ENVIRONMENT.tfvars
      - run: terraform plan -var-file="$ENVIRONMENT.tfvars"
      - run: terraform output -json

  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: [ plan ]
    environment: ${{ github.ref == 'refs/heads/main' && 'dev' || '' }}

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'dev' || '' }}

    defaults:
      run:
        working-directory: clouds/azure

    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.1"
      - run: terraform init -reconfigure -backend-config=backend/$ENVIRONMENT.backend.conf
      - run: echo "${{ secrets.TFVARS_FILE }}" | base64 -d > $ENVIRONMENT.tfvars
      - run: terraform apply -auto-approve -var-file="$ENVIRONMENT.tfvars"
      - run: terraform output -json
      - run: echo "PUBLIC_IP=$(terraform -chdir=infra/terraform output -raw public_ip_address)" >> "$GITHUB_OUTPUT"
