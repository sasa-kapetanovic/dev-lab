name: "Rollout Infrastructure"

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'dev' || '' }}

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ENVIRONMENT: ${{ github.ref == 'refs/heads/master' && 'dev' || '' }}

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.1"
      - run: terraform init -reconfigure -backend-config=backend/$ENVIRONMENT.backend.conf
      - run: terraform validate
      - run: echo "${{ secrets.TFVARS_FILE }}" | base64 -d > $ENVIRONMENT.tfvars
      - run: terraform plan -var-file="$ENVIRONMENT.tfvars"
      - run: terraform output -json

  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: [ plan ]
    environment: ${{ github.ref == 'refs/heads/master' && 'dev' || '' }}

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ENVIRONMENT: ${{ github.ref == 'refs/heads/master' && 'dev' || '' }}

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.1"
      - run: terraform init -reconfigure -backend-config=backend/$ENVIRONMENT.backend.conf
      - run: echo "${{ secrets.TFVARS_FILE }}" | base64 -d > $ENVIRONMENT.tfvars
      - run: terraform apply -auto-approve -var-file="$ENVIRONMENT.tfvars"
      - run: PUBLIC_IP=$(terraform output -raw public_ip_address)
      - run: echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

  configure-server:
    name: "Configure Server with Ansible"
    runs-on: ubuntu-latest
    needs: [ apply ]
    environment: ${{ github.ref == 'refs/heads/master' && 'dev' || '' }}

    env:
      ENVIRONMENT: ${{ github.ref == 'refs/heads/master' && 'dev' || '' }}

    defaults:
      run:
        working-directory: infra/ansible

    steps:
      - uses: actions/checkout@v3

      - name: Setup SSH key for Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Run Ansible playbook
        run: ansible-playbook -i inventory/hosts.yaml nginx.yml