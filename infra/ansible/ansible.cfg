[defaults]
inventory = $PWD/inventory
roles_path = $PWD/roles
remote_user = ansibleadmin
private_key_file = ~/.ssh/id_ed25519
display_skipped_hosts = True
system_warnings = True
deprecation_warnings = True
command_warnings = False
log_path=$PWD/log/output.log

[inventory]

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[persistent_connection]
connect_timeout = 30
command_timeout = 30

[colors]
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan
